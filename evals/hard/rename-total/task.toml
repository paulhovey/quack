prompt = "Rename the `grand_total` property of `Order` to `total_due` everywhere it is used: code, tests, email templates and the export's columns. The saved order files are read by other tools, so their format must not change: the files already in data/orders/ still load, and orders saved from now on have exactly the same keys as before."
