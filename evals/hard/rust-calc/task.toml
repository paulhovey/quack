category = "fix-test"
prompt = "`cargo test` fails: the calculator gets some expressions with `^` and unary minus wrong. Fix it so it follows the precedence rules written at the top of src/lib.rs. Don't change the tests."
requires = ["cargo"]
timeout_secs = 900

[[check]]
command = "cargo test --quiet --offline"
[[check]]
file = "tests/basic.rs"
contains = "assert_eq!(eval(\"-2 ^ 2\"), Ok(-4.0));"
