# cargo-deny: licences, advisories, bans, sources. Run: cargo deny check
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
# Apache-2.0-compatible licences only (docs/plan/00-architecture.md#key-dependencies-initial-picks).
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
# MPL-2.0 is file-level copyleft: using the crate unmodified is fine for an Apache-2.0
# binary, but it is allowed per crate rather than globally so new uses get a review.
exceptions = [
    { name = "nucleo-matcher", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
