name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Tests never read the developer's real config.
  QUACK_DEFAULTS_DIR: none

jobs:
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-latest }
          - { name: macos-arm64, os: macos-latest }
          - { name: windows-x64, os: windows-latest }
          - { name: windows-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the version; this installs it.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
        if: matrix.name == 'linux-x64'
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: minimal enterprise feature set builds
        if: matrix.name == 'linux-x64'
        run: cargo build -p quack-cli --locked --no-default-features --features proto-openai-chat,lang-common,sandbox
      - name: no-egress invariant (network namespace + connect() trace)
        if: matrix.name == 'linux-x64'
        run: |
          sudo apt-get install -y --no-install-recommends strace
          scripts/no-egress.sh
      - name: first-frame budget
        if: matrix.name == 'linux-x64'
        run: scripts/first-frame.sh 50

  # A scripted tool-call turn against real local servers on CPU, with a tiny model.
  local-servers:
    name: local server (${{ matrix.server }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server: [llama-cpp, ollama]
    env:
      MODELS_DIR: ${{ github.workspace }}/.ci-models
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: .ci-models
          # Bump when the model or image pins in scripts/local-server-ci.sh change.
          key: local-models-${{ matrix.server }}-${{ hashFiles('scripts/local-server-ci.sh') }}
      - run: cargo build --locked -p quack-cli
      - run: scripts/local-server-ci.sh ${{ matrix.server }}

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: read rust-version
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - run: rustup toolchain install ${{ steps.msrv.outputs.version }} --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +${{ steps.msrv.outputs.version }} check --workspace --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
