[package]
name = "quack-tools"
description = "Internal tools, the tool registry and the permission engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
quack-protocol.workspace = true
quack-config.workspace = true
quack-shell.workspace = true
quack-lsp.workspace = true
quack-store.workspace = true
quack-instructions.workspace = true
quack-sandbox.workspace = true
futures.workspace = true
globset = "0.4.20"
ignore = "0.4.33"
regex.workspace = true
serde_json.workspace = true
similar = "3.2.0"
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
# Outlines for `index` and large reads (feature `lang-common`).
tree-sitter = { version = "0.27.1", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-python = { version = "0.25.0", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-typescript = { version = "0.23.2", optional = true }

[features]
lang-common = ["dep:tree-sitter", "dep:tree-sitter-go", "dep:tree-sitter-javascript",
               "dep:tree-sitter-python", "dep:tree-sitter-rust", "dep:tree-sitter-typescript"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
