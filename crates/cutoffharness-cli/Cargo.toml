[package]
name = "cutoffharness-cli"
description = "The cutoffharness binary"
default-run = "cutoffharness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "cutoffharness"
path = "src/main.rs"

[dependencies]
cutoffharness-protocol.workspace = true
cutoffharness-config.workspace = true
cutoffharness-core.workspace = true
cutoffharness-tui.workspace = true
cutoffharness-exec.workspace = true
cutoffharness-acp = { workspace = true, optional = true }
cutoffharness-providers.workspace = true
cutoffharness-context.workspace = true
cutoffharness-tools.workspace = true
anyhow.workspace = true
clap.workspace = true
miette.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["proto-openai-chat", "proto-openai-responses", "proto-anthropic", "proto-ollama",
           "lang-common", "tokenizers-hf", "sandbox", "acp"]
proto-openai-chat = ["cutoffharness-providers/proto-openai-chat"]
proto-openai-responses = ["cutoffharness-providers/proto-openai-responses"]
proto-anthropic = ["cutoffharness-providers/proto-anthropic"]
proto-ollama = ["cutoffharness-providers/proto-ollama"]
lang-common = ["cutoffharness-context/lang-common"]
tokenizers-hf = ["cutoffharness-providers/tokenizers"]
sandbox = ["cutoffharness-tools/sandbox"]
acp = ["dep:cutoffharness-acp"]

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
