[package]
name = "quack-cli"
description = "The quack binary"
default-run = "quack"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "quack"
path = "src/main.rs"

[dependencies]
quack-protocol.workspace = true
quack-config.workspace = true
quack-core.workspace = true
quack-tui.workspace = true
quack-exec.workspace = true
quack-acp = { workspace = true, optional = true }
quack-providers.workspace = true
quack-context.workspace = true
quack-tools.workspace = true
quack-store.workspace = true
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
miette.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["proto-openai-chat", "proto-openai-responses", "proto-anthropic", "proto-ollama",
           "lang-common", "tokenizers-hf", "acp", "keyring"]
proto-openai-chat = ["quack-providers/proto-openai-chat"]
proto-openai-responses = ["quack-providers/proto-openai-responses"]
proto-anthropic = ["quack-providers/proto-anthropic"]
proto-ollama = ["quack-providers/proto-ollama"]
lang-common = ["quack-context/lang-common"]
tokenizers-hf = ["quack-providers/tokenizers"]
acp = ["dep:quack-acp"]
keyring = ["quack-config/keyring"]

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true

[lints]
workspace = true
