[package]
name = "quack-providers"
description = "Wire-protocol adapters, streaming, tool-call normalization and tokenizers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
quack-protocol.workspace = true
quack-config.workspace = true
futures.workspace = true
regex.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json", "http2", "system-proxy"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
# Already built for reqwest's TLS; the ChatGPT sign-in uses its SHA-256, RSA and random.
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"], optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wiremock.workspace = true
tempfile.workspace = true
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }

[features]
proto-openai-chat = []
proto-openai-responses = []
proto-anthropic = []
proto-ollama = []
auth-chatgpt = ["proto-openai-responses", "dep:aws-lc-rs"]
tokenizers = []

[lints]
workspace = true
